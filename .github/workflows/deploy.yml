name: Deploy Nation Reporters to nationreporters.com

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/nation-reporters
            echo "📦 Pulling latest code..."
            git pull origin master

            echo "🐳 Rebuilding Docker containers (production config)..."
            docker compose -f docker-compose.server.yml down
            docker compose -f docker-compose.server.yml up -d --build

            echo "⏳ Waiting for services to be healthy..."
            sleep 10

            # Health check - API
            echo "🔍 Checking API health..."
            curl -f http://localhost:3001/api/v1/health || {
              echo "❌ API health check failed"
              docker compose -f docker-compose.server.yml logs api | tail -20
              exit 1
            }

            # Health check - Web
            echo "🔍 Checking Web service..."
            curl -f http://localhost:3000/ > /dev/null || {
              echo "❌ Web service health check failed"
              docker compose -f docker-compose.server.yml logs web | tail -20
              exit 1
            }

            # Health check - PostgreSQL
            echo "🔍 Checking PostgreSQL..."
            docker compose -f docker-compose.server.yml exec -T postgres pg_isready -U postgres || {
              echo "❌ PostgreSQL health check failed"
              exit 1
            }

            echo "✅ Nation Reporters deployed successfully at $(date)"
            docker ps | grep nation

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} = 'success' ]; then
            echo "🎉 Nation Reporters deployed to nationreporters.com"
          else
            echo "❌ Nation Reporters deployment failed"
            exit 1
          fi
