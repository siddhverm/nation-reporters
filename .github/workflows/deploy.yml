name: Deploy Nation Reporters to nationreporters.com

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/nation-reporters
            git fetch origin master
            git reset --hard origin/master
            chmod +x scripts/deploy-production.sh
            bash scripts/deploy-production.sh

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            echo "Nation Reporters deployed to nationreporters.com"
          else
            echo "Nation Reporters deployment failed — check VPS_HOST (use 187.127.141.249), VPS_SSH_KEY, and re-run workflow"
            exit 1
          fi
